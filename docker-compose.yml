version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: rtx_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:-rtx}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-rtx}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
